[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultmcp"
version = "0.1.0"
description = "MCP server for a folder of Markdown notes with local web console"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "VaultMCP Team" }]
license = { text = "MIT" }
dependencies = [
    "mcp>=2.3.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "watchfiles>=1.0.0",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
vaultmcp = "server.vaultmcp.main:cli_entrypoint"

[tool.setuptools.packages.find]
where = ["server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["server/tests"]
pythonpath = ["server"]
